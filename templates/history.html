{% extends "base.html" %}

{% block content %}
{% if not goal %}
<!-- No goal state -->
<div class="empty-state">
  <div class="empty-icon">📊</div>
  <p class="empty-text">还没有学习记录</p>
  <p class="empty-hint">设定成长目标后，学习记录将在这里展示</p>
  <a href="/wizard" class="btn btn-primary">添加成长目标</a>
</div>
{% else %}
<!-- Loading -->
<div id="history-loading" class="portrait-loading">
  <div class="portrait-spinner"></div>
  <p>正在加载学习记录...</p>
</div>

<!-- Error -->
<div id="history-error" class="portrait-empty" style="display:none">
  <div class="empty-state">
    <div class="empty-icon">⚠️</div>
    <p class="empty-text">加载失败</p>
    <p class="empty-hint">无法获取学习记录数据，请稍后重试</p>
    <button class="btn btn-primary" onclick="location.reload()">重新加载</button>
  </div>
</div>

<!-- Content -->
<div id="history-content" style="display:none"></div>
{% endif %}
{% endblock %}

{% block scripts %}
{% if goal %}
<script>
(function() {
  const goalId = {{ goal.id }};

  async function loadHistory() {
    const loading = document.getElementById('history-loading');
    const errorDiv = document.getElementById('history-error');
    const container = document.getElementById('history-content');

    try {
      const resp = await fetch('/api/goals/' + goalId + '/history');
      const data = await resp.json();

      if (!data.ok) {
        showError(loading, errorDiv);
        return;
      }

      loading.style.display = 'none';

      if (!data.has_data) {
        showEmpty(container);
      } else {
        renderAll(container, data);
      }
    } catch (err) {
      showError(loading, errorDiv);
    }
  }

  function showError(loading, errorDiv) {
    loading.style.display = 'none';
    errorDiv.style.display = 'block';
  }

  function showEmpty(container) {
    container.style.display = 'block';
    container.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">📊</div>' +
        '<p class="empty-text">数据还在积累中</p>' +
        '<p class="empty-hint">完成任务后将逐步生成学习统计。</p>' +
      '</div>';
  }

  function renderAll(container, data) {
    container.style.display = 'block';
    var html = '';

    // Section 1: Calendar
    html += renderCalendar(data.calendar);
    // Section 2: Stats
    html += renderStats(data.stats);
    // Section 3: Trends
    html += renderTrends(data.trends);
    // Section 4: Recent Tasks
    html += renderRecentTasks(data.recent_tasks);
    // Section 5: AI Summary
    html += renderSummary(data.summary);

    container.innerHTML = html;
  }

  // ── Helpers ──

  function fmtMin(m) {
    if (m == null) return '--';
    return m + '分钟';
  }

  function diffLabel(difficulty, status) {
    if (status === 'skipped') return '⏭️ 跳过';
    if (difficulty === 'too_hard') return '😅 有点难';
    if (difficulty === 'too_easy') return '😴 太简单';
    if (difficulty === 'just_right') return '✅ 刚好合适';
    return '✅ 完成';
  }

  function pct(v) {
    return Math.round((v || 0) * 100) + '%';
  }

  // ── Calendar ──

  function renderCalendar(cal) {
    var days = cal.days || [];
    var html =
      '<section class="section">' +
        '<div class="section-header">' +
          '<h2 class="section-title">学习日历</h2>' +
        '</div>';

    // Weekday header
    var weekdays = ['一', '二', '三', '四', '五', '六', '日'];
    html += '<div class="cal-weekday-row">';
    weekdays.forEach(function(w) {
      html += '<span class="cal-weekday">' + w + '</span>';
    });
    html += '</div>';

    // Calendar grid
    html += '<div class="cal-grid">';
    // Pad before first day based on weekday
    var firstWeekday = days[0] ? days[0].weekday : 0;
    // Convert Python weekday (0=Mon) to Sun-based for display padding
    // We want Mon=0, ..., Sun=6 as columns. Already matches Python weekday().
    for (var p = 0; p < firstWeekday; p++) {
      html += '<div class="cal-day cal-day-empty"></div>';
    }
    days.forEach(function(d) {
      html += '<div class="cal-day cal-day-' + d.status + '" title="' + d.date + '">' + d.day + '</div>';
    });
    html += '</div>';

    // Legend
    html +=
      '<div class="cal-legend">' +
        '<span><span class="cal-dot cal-dot-completed"></span> 完成</span>' +
        '<span><span class="cal-dot cal-dot-partial"></span> 部分</span>' +
        '<span><span class="cal-dot cal-dot-none"></span> 未学习</span>' +
      '</div>';

    // Streaks
    html +=
      '<div class="cal-streaks">' +
        '<div class="cal-streak">' +
          '<span class="cal-streak-val">' + cal.current_streak + '天</span>' +
          '<span class="cal-streak-label">连续学习</span>' +
        '</div>' +
        '<div class="cal-streak">' +
          '<span class="cal-streak-val">' + cal.max_streak + '天</span>' +
          '<span class="cal-streak-label">历史最长</span>' +
        '</div>' +
      '</div>';

    html += '</section>';
    return html;
  }

  // ── Stats ──

  function renderStats(stats) {
    return (
      '<section class="section">' +
        '<div class="section-header">' +
          '<h2 class="section-title">学习统计</h2>' +
        '</div>' +
        '<div class="stats-grid">' +
          '<div class="stat-card">' +
            '<span class="stat-value">' + stats.total_hours + '</span>' +
            '<span class="stat-label">总学习(小时)</span>' +
          '</div>' +
          '<div class="stat-card">' +
            '<span class="stat-value">' + stats.week_minutes + '</span>' +
            '<span class="stat-label">本周(分钟)</span>' +
          '</div>' +
          '<div class="stat-card">' +
            '<span class="stat-value">' + stats.month_minutes + '</span>' +
            '<span class="stat-label">本月(分钟)</span>' +
          '</div>' +
          '<div class="stat-card">' +
            '<span class="stat-value">' + stats.done_count + '</span>' +
            '<span class="stat-label">已完成任务</span>' +
          '</div>' +
          '<div class="stat-card">' +
            '<span class="stat-value">' + stats.skipped_count + '</span>' +
            '<span class="stat-label">已跳过任务</span>' +
          '</div>' +
          '<div class="stat-card">' +
            '<span class="stat-value">' + fmtMin(stats.avg_duration_minutes) + '</span>' +
            '<span class="stat-label">平均时长</span>' +
          '</div>' +
        '</div>' +
      '</section>'
    );
  }

  // ── Trends ──

  function renderTrends(trends) {
    var html =
      '<section class="section">' +
        '<div class="section-header">' +
          '<h2 class="section-title">趋势分析</h2>' +
        '</div>';

    // 7-day chart
    html +=
      '<div class="chart-card">' +
        '<h3 class="chart-title">最近 7 天完成率</h3>' +
        '<div class="chart-container" id="chart-7d"></div>' +
      '</div>';

    // 30-day chart
    html +=
      '<div class="chart-card">' +
        '<h3 class="chart-title">最近 30 天完成率</h3>' +
        '<div class="chart-container" id="chart-30d"></div>' +
      '</div>';

    html += '</section>';

    // Render charts after DOM insertion
    setTimeout(function() {
      drawChart('chart-7d', trends.days7);
      drawChart('chart-30d', trends.days30);
    }, 50);

    return html;
  }

  function drawChart(elementId, data) {
    var el = document.getElementById(elementId);
    if (!el || !data || data.length < 2) {
      if (el) el.innerHTML = '<div class="chart-empty">数据不足</div>';
      return;
    }

    var W = 600, H = 200;
    var pad = { top: 20, right: 15, bottom: 35, left: 42 };
    var plotW = W - pad.left - pad.right;
    var plotH = H - pad.top - pad.bottom;

    var maxRate = 1.0;

    function xPos(i) {
      return pad.left + (i / (data.length - 1)) * plotW;
    }

    function yPos(rate) {
      return pad.top + plotH * (1 - rate / maxRate);
    }

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:100%">';

    // Grid lines
    for (var g = 0; g <= 4; g++) {
      var gy = yPos(g * 0.25);
      svg += '<line x1="' + pad.left + '" y1="' + gy + '" x2="' + (pad.left + plotW) + '" y2="' + gy + '" stroke="#F3F4F6" stroke-width="1"/>';
      svg += '<text x="' + (pad.left - 6) + '" y="' + (gy + 4) + '" text-anchor="end" fill="#9CA3AF" font-size="10">' + (g * 25) + '%</text>';
    }

    // Area fill
    var areaPoints = 'M' + xPos(0) + ',' + yPos(0);
    for (var ai = 0; ai < data.length; ai++) {
      areaPoints += ' L' + xPos(ai) + ',' + yPos(data[ai].rate);
    }
    areaPoints += ' L' + xPos(data.length - 1) + ',' + yPos(0) + ' Z';
    svg += '<path d="' + areaPoints + '" fill="url(#grad-' + elementId + ')" opacity="0.15"/>';

    // Gradient definition
    svg += '<defs><linearGradient id="grad-' + elementId + '" x1="0" y1="0" x2="0" y2="1">';
    svg += '<stop offset="0%" stop-color="#4F46E5"/>';
    svg += '<stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>';
    svg += '</linearGradient></defs>';

    // Line
    var points = data.map(function(d, i) {
      return xPos(i) + ',' + yPos(d.rate);
    }).join(' ');
    svg += '<polyline points="' + points + '" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';

    // Data dots
    data.forEach(function(d, i) {
      svg += '<circle cx="' + xPos(i) + '" cy="' + yPos(d.rate) + '" r="3" fill="#4F46E5" stroke="#FFF" stroke-width="1.5"/>';
    });

    // X labels (show every N)
    var step = Math.max(1, Math.floor(data.length / 5));
    data.forEach(function(d, i) {
      if (i % step === 0 || i === data.length - 1) {
        svg += '<text x="' + xPos(i) + '" y="' + (H - 5) + '" text-anchor="middle" fill="#9CA3AF" font-size="10">' + d.label + '</text>';
      }
    });

    // Baseline
    svg += '<line x1="' + pad.left + '" y1="' + yPos(0) + '" x2="' + (pad.left + plotW) + '" y2="' + yPos(0) + '" stroke="#E5E7EB" stroke-width="1"/>';

    svg += '</svg>';
    el.innerHTML = svg;
  }

  // ── Recent Tasks ──

  function renderRecentTasks(tasks) {
    var html =
      '<section class="section">' +
        '<div class="section-header">' +
          '<h2 class="section-title">最近任务</h2>' +
        '</div>';

    if (!tasks || tasks.length === 0) {
      html += '<div class="empty-state"><div class="empty-icon">📋</div><p class="empty-text">暂无任务记录</p></div>';
    } else {
      html += '<div class="task-list">';
      tasks.forEach(function(t) {
        var minutes = t.completed_minutes || t.estimated_minutes || '--';
        html +=
          '<a href="/task/' + t.id + '" class="task-list-item">' +
            '<div class="task-list-left">' +
              '<span class="task-list-title">' + escHtml(t.title) + '</span>' +
              '<span class="task-list-date">' + t.date + '</span>' +
            '</div>' +
            '<div class="task-list-right">' +
              '<span class="task-list-status">' + diffLabel(t.difficulty, t.status) + '</span>' +
              '<span class="task-list-min">' + minutes + '</span>' +
            '</div>' +
          '</a>';
      });
      html += '</div>';
    }

    html += '</section>';
    return html;
  }

  function escHtml(s) {
    if (!s) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s));
    return div.innerHTML;
  }

  // ── AI Summary ──

  function renderSummary(summary) {
    var trendIcon = '';
    if (summary.growth_trend === '持续进步') trendIcon = ' 📈';
    else if (summary.growth_trend === '保持稳定') trendIcon = ' ➡️';
    else if (summary.growth_trend === '需要关注') trendIcon = ' ⚠️';

    return (
      '<section class="section">' +
        '<div class="section-header">' +
          '<h2 class="section-title">AI 成长总结</h2>' +
        '</div>' +
        '<div class="summary-card">' +
          '<div class="summary-header">过去 7 天</div>' +
          '<div class="summary-grid">' +
            '<div class="summary-item">' +
              '<span class="summary-label">完成率</span>' +
              '<span class="summary-value">' + pct(summary.week_completion_rate) + '</span>' +
            '</div>' +
            '<div class="summary-item">' +
              '<span class="summary-label">平均学习时长</span>' +
              '<span class="summary-value">' + summary.week_avg_minutes + '分钟</span>' +
            '</div>' +
            '<div class="summary-item">' +
              '<span class="summary-label">连续学习</span>' +
              '<span class="summary-value">' + summary.current_streak + '天</span>' +
            '</div>' +
            '<div class="summary-item">' +
              '<span class="summary-label">成长趋势</span>' +
              '<span class="summary-value">' + summary.growth_trend + trendIcon + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="summary-suggestion">' +
            '<span class="summary-suggestion-icon">💡</span>' +
            '<span class="summary-suggestion-text">' + escHtml(summary.suggestion) + '</span>' +
          '</div>' +
        '</div>' +
      '</section>'
    );
  }

  // ── Go ──
  loadHistory();
})();
</script>
{% endif %}
{% endblock %}
